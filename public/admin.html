<!DOCTYPE html>
<html lang="pt-BR">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0">
  <title>Painel Admin - GruposNJ</title>
  <style>
    body { background: #0f172a; color: #f8fafc; font-family: Arial, sans-serif; padding: 15px; margin: 0; }
    h2 { font-size: 1.2rem; text-align: center; color: #38bdf8; }
    .card { background: #1e293b; padding: 15px; border-radius: 10px; margin-bottom: 15px; box-shadow: 0 4px 6px rgba(0,0,0,0.3); }
    .btn { background: #22c55e; color: white; border: none; padding: 10px; width: 100%; border-radius: 6px; font-weight: bold; cursor: pointer; }
    .btn-sm { padding: 5px 10px; border: none; border-radius: 4px; cursor: pointer; font-size: 0.8rem; font-weight: bold; color: white; }
    .btn-green { background: #22c55e; }
    .btn-red { background: #ef4444; }
    .btn-yellow { background: #eab308; color: #0f172a; }
    input { width: 100%; padding: 10px; margin-bottom: 10px; background: #0f172a; border: 1px solid #334155; color: white; border-radius: 6px; box-sizing: border-box; }
    .item { background: #0f172a; padding: 10px; margin-bottom: 8px; border-radius: 6px; }
  </style>
</head>
<body>

  <h2>🛡️ Painel de Administração</h2>

  <!-- TELA DE LOGIN -->
  <div id="login-box" class="card">
    <p>Acesso Restrito</p>
    <input type="password" id="admin-pass" placeholder="Digite a senha...">
    <button class="btn" onclick="autenticar()">Entrar</button>
  </div>

  <!-- CONTEÚDO DO ADMIN -->
  <div id="admin-content" style="display: none;">
    
    <!-- BOTÃO DE ATUALIZAR QUE VOCÊ PEDIU -->
    <div style="margin-bottom: 15px; text-align: right;">
      <button onclick="carregarDados()" style="background: #38bdf8; color: #0f172a; border: none; padding: 8px 14px; border-radius: 6px; font-weight: bold; cursor: pointer;">🔄 Atualizar Dados</button>
    </div>

    <div class="card">
      <h3>📋 Solicitações Pendentes</h3>
      <div id="lista-solicitacoes">Carregando...</div>
    </div>

    <div class="card">
      <h3>🌐 Todos os Grupos (Gerenciar VIPs)</h3>
      <div id="lista-todos-grupos">Carregando...</div>
    </div>
  </div>

  <script>
    let grupoIdSelecionado = null;

    async function autenticar() {
      const senhaInput = document.getElementById('admin-pass').value.trim();
      const senhaCorreta = "Joao153153*";

      if (senhaInput === senhaCorreta) {
        localStorage.setItem('adminPassword', senhaInput);
        document.getElementById('login-box').style.display = 'none';
        document.getElementById('admin-content').style.display = 'block';
        carregarDados();
      } else {
        alert('Senha incorreta!');
      }
    }

    function carregarDados() {
      carregarSolicitacoes();
      carregarGrupos();
    }

    async function carregarSolicitacoes() {
      const container = document.getElementById('lista-solicitacoes');
      container.innerHTML = '<p style="color:#38bdf8;">Buscando solicitações...</p>';
      try {
        const res = await fetch('https://gruposnj.onrender.com/api/admin/solicitacoes');
        if (!res.ok) throw new Error('Status ' + res.status);
        const sol = await res.json();

        if (!Array.isArray(sol) || sol.length === 0) {
          container.innerHTML = '<p style="color:#94a3b8; font-size:0.85rem;">Nenhuma solicitação pendente.</p>';
          return;
        }

        container.innerHTML = sol.map(s => `
          <div class="item">
            <strong>${s.nome || 'Sem nome'}</strong><br>
            <small style="color:#38bdf8;">${s.link || ''}</small>
            <div style="margin-top:8px;">
              <button class="btn-sm btn-green" onclick="decidir('${s.id}', true)">Aceitar</button>
              <button class="btn-sm btn-red" onclick="decidir('${s.id}', false)">Recusar</button>
            </div>
          </div>
        `).join('');
      } catch(e) {
        container.innerHTML = '<p style="color:#ef4444;">Erro ao carregar solicitações: ' + e.message + '</p>';
      }
    }

    async function carregarGrupos() {
      const container = document.getElementById('lista-todos-grupos');
      container.innerHTML = '<p style="color:#38bdf8;">Buscando grupos...</p>';
      try {
        const res = await fetch('https://gruposnj.onrender.com/api/grupos');
        if (!res.ok) throw new Error('Status ' + res.status);
        const grupos = await res.json();

        if (!Array.isArray(grupos) || grupos.length === 0) {
          container.innerHTML = '<p style="color:#94a3b8; font-size:0.85rem;">Nenhum grupo cadastrado.</p>';
          return;
        }

        container.innerHTML = grupos.map(g => `
          <div class="item">
            <strong>${g.nome || 'Sem nome'}</strong> ${g.isVip ? '<span style="color:#eab308; font-size:0.75rem;">[VIP]</span>' : ''}<br>
            <small style="color:#94a3b8;">${g.link || ''}</small>
            <div style="margin-top:8px;">
              ${g.isVip ?
                `<button class="btn-sm btn-red" onclick="removerVip('${g.id}')">Remover VIP</button>` :
                `<button class="btn-sm btn-yellow" onclick="ativarVip('${g.id}')">Dar VIP</button>`
              }
              <button class="btn-sm btn-red" onclick="deletarGrupo('${g.id}')">🗑️ Deletar</button>
            </div>
          </div>
        `).join('');
      } catch(e) {
        container.innerHTML = '<p style="color:#ef4444;">Erro ao carregar grupos: ' + e.message + '</p>';
      }
    }

    async function decidir(id, aceito) {
      const senha = localStorage.getItem('adminPassword');
      const res = await fetch('https://gruposnj.onrender.com/api/admin/decidir-solicitacao', {
        method: 'POST',
        headers: { 'Content-Type': 'application/json' },
        body: JSON.stringify({ senha, id, aceito })
      });
      carregarDados();
    }

    async function ativarVip(grupoId) {
      const senha = localStorage.getItem('adminPassword');
      await fetch('https://gruposnj.onrender.com/api/admin/ativar-vip', {
        method: 'POST',
        headers: { 'Content-Type': 'application/json' },
        body: JSON.stringify({ senha, grupoId, dias: 30 })
      });
      carregarDados();
    }

    async function removerVip(grupoId) {
      const senha = localStorage.getItem('adminPassword');
      await fetch('https://gruposnj.onrender.com/api/admin/remover-vip', {
        method: 'POST',
        headers: { 'Content-Type': 'application/json' },
        body: JSON.stringify({ senha, grupoId })
      });
      carregarDados();
    }

    async function deletarGrupo(id) {
      if(!confirm('Tem certeza que quer deletar?')) return;
      const senha = localStorage.getItem('adminPassword');
      await fetch(`https://gruposnj.onrender.com/api/grupos/${id}`, {
        method: 'DELETE',
        headers: { 'Content-Type': 'application/json' },
        body: JSON.stringify({ senha })
      });
      carregarDados();
    }
  </script>
</body>
</html>
