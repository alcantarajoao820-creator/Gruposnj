<!DOCTYPE html>
<html lang="pt-BR">
<head>
  <link rel="icon" type="image/png" href="IconNj.png">
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0">
  <title>Login - GruposNJ</title>
  <style>
    * { box-sizing: border-box; font-family: 'Inter', system-ui, sans-serif; margin: 0; padding: 0; }
    body { background: #070a12; color: #f1f5f9; display: flex; align-items: center; justify-content: center; min-height: 100vh; padding: 20px; }

    #container-login { display: none; width: 100%; max-width: 400px; }

    .box { background: #0f172a; border: 1px solid #1e293b; padding: 30px; border-radius: 16px; width: 100%; text-align: center; }
    h2 { font-size: 1.5rem; color: #38bdf8; margin-bottom: 20px; }
    input { width: 100%; padding: 12px; margin-bottom: 12px; background: #161e2e; border: 1px solid #334155; color: #fff; border-radius: 8px; font-size: 0.95rem; }
    .btn { width: 100%; padding: 12px; border: none; border-radius: 8px; font-weight: bold; background: #22c55e; color: #000; cursor: pointer; margin-bottom: 10px; font-size: 0.95rem; }
    .btn:hover { background: #16a34a; color: #fff; }
    .btn-google { background: #ffffff; color: #000; display: flex; align-items: center; justify-content: center; gap: 10px; font-weight: 600; }
    .btn-google:hover { background: #f1f5f9; color: #000; }
    
    .links-container { display: flex; justify-content: space-between; align-items: center; margin-top: 15px; font-size: 0.85rem; }
    .links-container a { color: #94a3b8; text-decoration: none; transition: color 0.2s; }
    .links-container a:hover { color: #38bdf8; }

    .divider { margin: 15px 0; color: #64748b; font-size: 0.85rem; position: relative; }
    .divider::before, .divider::after { content: ""; position: absolute; top: 50%; width: 40%; height: 1px; background: #334155; }
    .divider::before { left: 0; }
    .divider::after { right: 0; }

    #loading-screen { text-align: center; color: #38bdf8; font-weight: bold; }

    /* Modal Customizado */
    .modal-overlay { position: fixed; top:0; left:0; width:100%; height:100%; background:rgba(0,0,0,0.85); display:none; align-items:center; justify-content:center; z-index: 1000; }
    .modal-overlay.active { display:flex; }
    .modal-box { background:#0f172a; border:1px solid #334155; padding:20px; border-radius:12px; max-width:320px; width:90%; text-align: center; }
  </style>
  <script src="https://www.gstatic.com/firebasejs/10.8.0/firebase-app-compat.js"></script>
  <script src="https://www.gstatic.com/firebasejs/10.8.0/firebase-auth-compat.js"></script>
</head>
<body>

  <div id="loading-screen">Verificando sessão...</div>

  <div id="container-login">
    <div class="box">
      <h2>Entre na sua conta</h2>

      <button class="btn btn-google" onclick="loginGoogle()">
        <svg width="18" height="18" viewBox="0 0 24 24"><path fill="#4285F4" d="M22.56 12.25c0-.78-.07-1.53-.2-2.25H12v4.26h5.92c-.26 1.37-1.04 2.53-2.21 3.31v2.77h3.57c2.08-1.92 3.28-4.74 3.28-8.09z"/><path fill="#34A853" d="M12 23c2.97 0 5.46-.98 7.28-2.66l-3.57-2.77c-.98.66-2.23 1.06-3.71 1.06-2.86 0-5.29-1.93-6.16-4.53H2.18v2.84C3.99 20.53 7.7 23 12 23z"/><path fill="#FBBC05" d="M5.84 14.09c-.22-.66-.35-1.36-.35-2.09s.13-1.43.35-2.09V7.06H2.18C1.43 8.55 1 10.22 1 12s.43 3.45 1.18 4.94l2.85-2.22.81-.63z"/><path fill="#EA4335" d="M12 5.38c1.62 0 3.06.56 4.21 1.64l3.15-3.15C17.45 2.09 14.97 1 12 1 7.7 1 3.99 3.47 2.18 7.06l3.66 2.84c.87-2.6 3.3-4.52 6.16-4.52z"/></svg>
        Entrar com o Google
      </button>

      <div class="divider">ou</div>

      <form id="form-auth">
        <input type="email" id="email" placeholder="Seu E-mail" required>
        <input type="password" id="senha" placeholder="Sua Senha" required>
        <button type="submit" class="btn">Entrar / Cadastrar</button>
      </form>

      <div class="links-container">
        <a href="#" onclick="abrirEsqueceuSenha()">Esqueceu a senha?</a>
        <a href="/">← Voltar ao início</a>
      </div>
    </div>
  </div>

  <!-- Modal Aviso Dark -->
  <div class="modal-overlay" id="modal">
    <div class="modal-box">
      <h3 style="color:#38bdf8; margin-bottom:10px;" id="modal-titulo">Aviso</h3>
      <p id="modal-msg" style="font-size:0.9rem; margin-bottom:15px; color:#cbd5e1;"></p>
      
      <!-- Conteúdo dinâmico para input de recuperação se necessário -->
      <div id="modal-extra" style="margin-bottom: 15px; display: none;">
        <input type="email" id="email-recuperacao" placeholder="Digite seu e-mail" style="margin-bottom:0;">
      </div>

      <div style="display: flex; gap: 10px;">
        <button onclick="fecharModal()" class="btn" style="background:#334155; color:#fff; margin-bottom:0;" id="btn-cancelar">Cancelar</button>
        <button onclick="acaoModal()" class="btn" style="margin-bottom:0;" id="btn-ok">OK</button>
      </div>
    </div>
  </div>

  <script>
// Função para registrar o usuário no seu servidor local automaticamente
async function registrarNoServidorLocal(email) {
  try {
    await fetch('/api/usuario/perfil', {
      method: 'POST',
      headers: { 'Content-Type': 'application/json' },
      body: JSON.stringify({ email: email, nomeExibicao: email.split('@')[0] })
    });
  } catch (e) {
    console.error("Erro ao sincronizar com servidor local", e);
  }
}

    const firebaseConfig = {
      apiKey: "AIzaSyBL0KaXCwVBA9bbnjZOjARidMlG0sAI-Hw",
      authDomain: "gruposnj-41858.firebaseapp.com",
      projectId: "gruposnj-41858",
      storageBucket: "gruposnj-41858.firebasestorage.app",
      messagingSenderId: "249583894572",
      appId: "1:249583894572:web:f61a19ffe2a0867b441189"
    };

    firebase.initializeApp(firebaseConfig);
    const auth = firebase.auth();
    
    // Força o Firebase a enviar e-mails em Português do Brasil
    auth.languageCode = 'pt-BR';

    let modoModal = 'aviso'; // 'aviso' ou 'recuperar'

        auth.onAuthStateChanged((user) => {
      if (user) {
        registrarNoServidorLocal(user.email);
        window.location.replace('/painel.html');
      } else {
        document.getElementById('loading-screen').style.display = 'none';
        document.getElementById('container-login').style.display = 'block';
      }
    });

    function mostrarAviso(msg, titulo = 'Aviso') {
      modoModal = 'aviso';
      document.getElementById('modal-titulo').innerText = titulo;
      document.getElementById('modal-msg').innerText = msg;                                                                                  document.getElementById('modal-extra').style.display = 'none';
      document.getElementById('btn-cancelar').style.display = 'none';
      document.getElementById('btn-ok').innerText = 'OK';
      document.getElementById('modal').classList.add('active');
    }

    function abrirEsqueceuSenha() {
      modoModal = 'recuperar';
      document.getElementById('modal-titulo').innerText = 'Recuperar Senha';
      document.getElementById('modal-msg').innerText = 'Insira seu e-mail cadastrado para receber o link de redefinição de senha:';
      document.getElementById('email-recuperacao').value = document.getElementById('email').value; // Puxa se já digitou
      document.getElementById('modal-extra').style.display = 'block';
      document.getElementById('btn-cancelar').style.display = 'block';
      document.getElementById('btn-ok').innerText = 'Enviar Link';
      document.getElementById('modal').classList.add('active');
    }

    function fecharModal() {
      document.getElementById('modal').classList.remove('active');
    }

    async function acaoModal() {
      if (modoModal === 'aviso') {
        fecharModal();
      } else if (modoModal === 'recuperar') {
        const emailRec = document.getElementById('email-recuperacao').value;
        if (!emailRec) {
          alert('Por favor, preencha o e-mail.');
          return;
        }
        try {
          await auth.sendPasswordResetEmail(emailRec);
          fecharModal();
          mostrarAviso('E-mail de recuperação enviado com sucesso! Verifique sua caixa de entrada e spam.', 'Sucesso');
        } catch (error) {
          let mensagemErro = 'Erro ao enviar e-mail.';
          if (error.code === 'auth/user-not-found') {
            mensagemErro = 'Não há nenhum usuário cadastrado com este e-mail.';
          } else if (error.code === 'auth/invalid-email') {
            mensagemErro = 'O formato do e-mail digitado é inválido.';
          }
          mostrarAviso(mensagemErro, 'Erro');
        }
      }
    }

    async function loginGoogle() {
      const provider = new firebase.auth.GoogleAuthProvider();
      try {
        await auth.signInWithPopup(provider);
      } catch (error) {
        mostrarAviso('Erro no login com Google: ' + error.message);
      }
    }

    document.getElementById('form-auth').addEventListener('submit', async (e) => {
      e.preventDefault();
      const email = document.getElementById('email').value;
      const senha = document.getElementById('senha').value;

      try {
        await auth.signInWithEmailAndPassword(email, senha);
      } catch (err) {
        // Tratamento de erros detalhado e amigável em português
        if (err.code === 'auth/wrong-password') {
          mostrarAviso('Senha incorreta. Verifique sua senha e tente novamente.');
        } else if (err.code === 'auth/invalid-email') {
          mostrarAviso('O endereço de e-mail informado não é válido.');
        } else if (err.code === 'auth/user-disabled') {
          mostrarAviso('Esta conta foi desativada.');
        } else if (err.code === 'auth/email-already-in-use') {
          mostrarAviso('Este e-mail já está cadastrado. Tente fazer login.');
        } else if (err.code === 'auth/weak-password') {
          mostrarAviso('A senha é muito fraca. Escolha uma senha com pelo menos 6 caracteres.');
        } else if (err.code === 'auth/user-not-found' || err.code === 'auth/invalid-credential') {
          // Se o usuário não existe, tenta criar a conta automaticamente como no seu fluxo original
          try {
            const userCredential = await auth.createUserWithEmailAndPassword(email, senha);
            await userCredential.user.sendEmailVerification();
            mostrarAviso('Conta criada com sucesso! Enviamos um e-mail de verificação para ' + email + '.', 'Bem-vindo!');
          } catch (createErr) {
            let erroCriacao = createErr.message;
            if (createErr.code === 'auth/weak-password') {
              erroCriacao = 'A senha precisa ter pelo menos 6 caracteres.';
            } else if (createErr.code === 'auth/email-already-in-use') {
              erroCriacao = 'Este e-mail já está em uso por outra conta.';
            }
            mostrarAviso('Erro ao criar conta: ' + erroCriacao);
          }
        } else {
          mostrarAviso('Erro no acesso: ' + err.message);
        }
      }
    });

  </script>
</body>
</html>
